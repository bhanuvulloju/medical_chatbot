name: Medibot-cicd-pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  APP_NAME: Medical Chatbot

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          # Cache pip downloads based on changes to requirements.txt.
          # The first run creates the cache; later runs restore it when available.
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Explain the pip cache
        run: |
          echo "The setup-python action checks the cache before dependency installation."
          echo "GitHub restores matching packages for this OS, Python version, and requirements.txt."
          echo "If requirements.txt changes, setup-python creates a new cache key."
          echo "Cache is stored by GitHub Actions and cannot be found in the repository workspace."

      - name: Install Python dependencies using the pip cache
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Print workflow information
        run: |
          echo "Application: $APP_NAME"
          echo "Python version:"
          python --version
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Branch or tag: $GITHUB_REF_NAME"

      - name: Run a basic Python check
        run: python -c "print('GitHub Actions workflow is running successfully')"

      - name: Create workflow summary
        run: |
          echo "### $APP_NAME build summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Python: 3.10" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runner: ubuntu-latest" >> "$GITHUB_STEP_SUMMARY"
          echo "- Event: $GITHUB_EVENT_NAME" >> "$GITHUB_STEP_SUMMARY"

      - name: Create build information file
        run: |
          echo "App: $APP_NAME" > build-info.txt
          echo "Event: $GITHUB_EVENT_NAME" >> build-info.txt
          echo "Commit: $GITHUB_SHA" >> build-info.txt

      - name: Upload build information
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.txt